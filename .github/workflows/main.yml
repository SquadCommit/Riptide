##
# Continuous integration: native solver checks, WebAssembly build,
# and the React frontend — run as independent parallel jobs.
##
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  solver:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libnetcdf-dev clang-format-18 cppcheck

      - name: Style Check
        run: find src/ -name "*.cpp" -o -name "*.h" | xargs clang-format-18 --dry-run --Werror

      - name: Static Code Analysis
        run: cppcheck src/ --template=gcc --force --error-exitcode=1

      - name: Unit Tests
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -G Ninja
          cmake --build build --target tests tsunami_lab -j$(nproc)
          ./build/tests

      - name: Sanitizers
        run: |
          cmake -B build_san -DBUILD_MODE=debug+san -G Ninja
          cmake --build build_san --target tests tsunami_lab -j$(nproc)
          ./build_san/tests
          ./build_san/tsunami_lab -n 25 -s FWave -p DamBreak 10 5 5

  wasm:
    runs-on: ubuntu-latest
    # Same pinned toolchain as docker/web.Dockerfile
    container: emscripten/emsdk:6.0.2

    steps:
      - uses: actions/checkout@v7

      - name: Build WebAssembly bundle
        run: |
          apt-get update && apt-get install -y --no-install-recommends ninja-build
          emcmake cmake -B build-web -G Ninja
          cmake --build build-web

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Frontend
        working-directory: web
        run: |
          npm ci
          npm run build
